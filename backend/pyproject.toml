[project]
name = "neuropulse-backend"
version = "0.1.0"
description = "NEUROPULSE — connectome-constrained experience simulation on the MaleCNS v1.0 Drosophila connectome"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "neuprint-python>=0.4.26",
    "pandas>=2.2",
    "pyarrow>=19",
    "numpy>=1.26",
    "scipy>=1.14",
    "networkx>=3.3",
    "requests>=2.32",
    "orjson>=3.10",
]

[project.optional-dependencies]
nlp = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
